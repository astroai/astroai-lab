# Goose Agent (block/goose) — registry entry.
# Schema: docs/agent-rethink-plan.md §4 Phase 1. Single source of truth for
# `agent list` / `agent install` / `agent remove` / `agent verify`.
id: goose
name: Goose Agent
homepage: https://github.com/block/goose
summary: Block's open-source autonomous AI developer CLI
binary: goose
tags: [agent, cli, open]
install:
  method: curl
  source: https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh
  env:
    GOOSE_BIN_DIR: "{bin_dir}" # land the binary in the session bin dir
    CONFIGURE: "false"         # never auto-run the interactive onboarding
  post_binary_paths:
    - "~/.local/bin/goose"
config:
  path: "~/.config/goose/config.yaml"
  format: yaml
  provider_key: GOOSE_PROVIDER
verify:
  - "goose --version"
  - "test -f ~/.config/goose/config.yaml"
plugins: [skill, mcp, config, addon]
notes: Uses ~/.config/goose/config.yaml (provider/model set by `agent models free`)
