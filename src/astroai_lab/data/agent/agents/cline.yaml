# Cline CLI — registry entry.
# Schema: docs/agent-rethink-plan.md §4 Phase 1. Single source of truth for
# `agent catalog` / `agent list` / `agent install` / `agent remove` / `agent verify`.
id: cline
name: Cline CLI
homepage: https://github.com/cline/cline
summary: Autonomous coding agent CLI with tool use and safety checks
binary: cline
tags: [agent, cli]
install:
  method: npm
  source: cline@latest
config:
  path: "~/.config/canfar/lab/cline-free.md"
  format: markdown
  provider_key: OPENROUTER_API_KEY
verify:
  - "cline --version"
  - "test -f ~/.config/canfar/lab/cline-free.md"
plugins: [skill, mcp, config, addon]
notes: Free-tier model config written by `agent models free`
