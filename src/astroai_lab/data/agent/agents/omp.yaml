# Oh My Pi (omp) — fork of Pi coding agent with sessions/subagents/slash commands.
# Schema: docs/agent-rethink-plan.md §4 Phase 1.
id: omp
name: Oh My Pi
homepage: https://github.com/can1357/oh-my-pi
summary: Coding agent CLI (omp) — sessions, subagents, slash commands; fork of Pi
binary: omp
tags: [agent, cli, open]
install:
  method: npm
  source: "@oh-my-pi/pi-coding-agent@latest"
verify:
  - "omp --version"
plugins: [skill, mcp, config, addon]
notes: Binary is `omp`. Prefer npm; upstream also supports `bun install -g @oh-my-pi/pi-coding-agent`. Distinct from `pi` (earendil-works).
